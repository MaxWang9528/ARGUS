# ARGUS settings. Copy this file to config.toml and edit it.
# config.toml is ignored by git, so secrets in it stay on this machine.

[general]
data_dir = "clips"             # buffers, clips, database, browser logins; relative = inside this project folder
auto_upload = false            # also switchable from the dashboard
auto_clip = true               # clip the peaks the detector finds (off: only "Clip now"); also a dashboard switch
dashboard_host = "127.0.0.1"
dashboard_port = 8787
max_concurrent_renders = 1
retention_days = 7             # delete raw and rendered clip files older than this (0 = keep)
# When max_streamers limits recording, streams in these Twitch categories (exact names,
# case-insensitive) are recorded first. Not a filter: peaks in any category are clipped.
priority_categories = []       # e.g. ["Minecraft"]
max_streamers = 12             # record at most this many live streamers at once (0 = no limit): priority_categories first, then most viewers; ~80 MB RAM and 0.4 MB/s each

[twitch]                       # optional: Helix keys for faster live checks and titles
client_id = ""
client_secret = ""
live_check_interval_s = 20       # seconds between live checks (a stream start can take 1-2 min to show)

[detection]                    # defaults for every streamer; a [[streamers]] entry can override any of these
bin_s = 1
smooth_s = 5
baseline_window_s = 300        # how far back "normal chat" is measured (shorter = follows chat faster)
recent_baseline_s = 90         # if chat over this long is busier, that becomes normal (0 = off)
multiplier = 3.0               # a peak needs chat at this many times normal
z_threshold = 4.0
min_msgs_per_sec = 2.0
min_unique_chatters = 5
end_ratio = 1.5                # the peak ends when chat falls below this many times normal
cooldown_s = 90
min_sustain_s = 10             # chat must stay raised this long; shorter bursts are spikes, not clipped
preroll_s = 8                  # seconds kept before chat starts rising (chat reacts a few s after the moment)
postroll_s = 3                 # seconds kept after chat falls back...
max_after_peak_s = 12          # ...but never more than this after the busiest second
max_clip_s = 35
manual_preroll_s = 20          # "Clip now": seconds before the press
manual_postroll_s = 11         # and after it
ignore_users = ["nightbot", "streamelements", "moobot", "fossabot"]

[capture]
quality = "720p60,720p,best"
buffer_minutes = 3
snapshot_interval_s = 2
low_latency = true
filter_ads = true
sync_offset_s = -2.0           # signed seconds; a positive number moves clips later.
                               # -2.0 is an estimate of viewer delay; tune it on a live stream

[render]
default_layout = "blur_fit"    # blur_fit, crop or stacked
fit_zoom = 1.0                 # blur_fit only: above 1.0 enlarges the picture and trims the sides
resolution = "1080x1920"
burn_title = true

[tiktok]
browser_profile_dir = ""       # "" = <data_dir>/browser_profile
browser_channel = "chromium"   # or "chrome" if Google Chrome is installed
cookies_file = ""              # fallback if TikTok blocks the in-app login
headless = false
dry_run = true                 # never click Post; what happens instead is set by dry_run_mode
dry_run_mode = "stop"          # "stop": stop on the filled-in form and save a screenshot
                               # "draft": click Save draft, so the clip lands in your TikTok drafts (not posted)
# Caption for new clips: {streamer} = channel, {category} = the stream's Twitch category.
# A [[tiktok.category_captions]] entry below replaces it for one category.
caption_template = "{streamer} 🔴 {category} on Twitch #{streamer} #twitch #clips"
max_uploads_per_day = 6          # these two limits (and browser_profile_dir, cookies_file)
min_minutes_between_uploads = 45 # apply to the implicit "default" account, used when no
                                 # [[tiktok.accounts]] are listed below
cycle_accounts = false           # true: each upload goes to the next account with a free slot, in turn
                                 # false: always the first account (in list order) with a free slot
max_queue_age_h = 6              # a queued clip with no free slot for this many hours is dropped (0 = never)

# Captions for particular categories (exact Twitch name, case-insensitive).
# [[tiktok.category_captions]]
# category = "Minecraft"
# caption = "{streamer} playing Minecraft 🔴 #minecraft #{streamer} #twitch"

# More than one TikTok account: list them here (this replaces the "default" account).
# Each has its own browser profile; log each one in with `./lw login-tiktok --account NAME`
# or the Log in button on the dashboard. Dry runs still rotate through the accounts.
# [[tiktok.accounts]]
# name = "main"                      # letters, digits, . _ - (also the profile folder name)
# enabled = true
# browser_profile_dir = ""           # "" = <data_dir>/accounts/main/browser_profile
# cookies_file = ""
# max_uploads_per_day = 6
# min_minutes_between_uploads = 45
#
# [[tiktok.accounts]]
# name = "second"
# max_uploads_per_day = 3
# min_minutes_between_uploads = 90

# Twitch channels to watch: English-speaking streamers, the ones with the youngest and
# fastest-growing audiences first, then the biggest established names. Every one is
# checked for being live and has its chat read; only the top general.max_streamers live
# ones are recorded (ranked by live viewers). Set enabled = false to skip one.
#
# Every entry can also set its own layout and override any [detection] setting:
# [[streamers]]
# name = "somestreamer"
# enabled = true
# layout = "stacked"
# crop_x = 0.5                                           # crop layout: 0 = left, 1 = right
# stack_top = { x = 0.0, y = 0.6, w = 0.25, h = 0.4 }    # fractions of the frame
# stack_bottom = { x = 0.15, y = 0.0, w = 0.7, h = 1.0 }
# stack_split = 0.4                                      # share of the height the top region gets
# multiplier = 2.5                                       # a detection override for this streamer

